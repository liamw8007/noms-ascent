<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nom's Ascent</title>
  <!-- Content Security Policy (SEC-03/05): only this site's own files may run or be fetched.
       'wasm-unsafe-eval' lets Pyodide compile its WebAssembly. The server also sends this
       policy as a header (plus frame-ancestors, which a meta tag can't set). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="stylesheet" href="static/css/game.css">
</head>
<!-- mode is "server" when Flask renders this page and "static" in the GitHub Pages build. -->
<body data-mode="static">
  <main>
    <canvas id="game" width="640" height="384"></canvas>
    <p id="msg">Loading Python (Pyodide)…</p>
    <section id="scores">
      <h2>High scores</h2>
      <form id="score-form" hidden>
        <label>Your name <input id="score-name" maxlength="16" required autocomplete="off"></label>
        <button>Save score</button>
      </form>
      <p id="score-msg"></p>
      <table id="score-table" hidden>
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Levels</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <!-- Pyodide 314.0.8, hosted with the game (SEC-03): see static/pyodide/README.md -->
  <script src="static/pyodide/pyodide.js"></script>
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
